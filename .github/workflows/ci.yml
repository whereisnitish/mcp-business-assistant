name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app mcp_servers tests
          ruff format --check app mcp_servers tests

      # The full suite runs without credentials, a network or PostgreSQL, so CI
      # needs no services. `-m "not live"` includes the subprocess transport
      # tests, which are the only ones that catch a regression in the
      # environment passed to MCP child processes.
      - name: Test
        run: pytest -m "not live" --cov=app --cov=mcp_servers --cov-report=term

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
