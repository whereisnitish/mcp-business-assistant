[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-business-assistant"
version = "1.0.0"
description = "Production-style AI business assistant built on the Model Context Protocol, LangGraph and FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rishab Sharma" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "langgraph", "fastapi", "tool-calling"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]

dependencies = [
    # --- MCP (official Python SDK, v2 API: mcp.server.mcpserver.MCPServer / mcp.Client) ---
    "mcp>=2.2.0,<3.0.0",
    # --- Agent orchestration ---
    "langgraph>=1.2.0,<2.0.0",
    # --- API layer ---
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    # --- Validation / settings ---
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.15.0",
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.0",
    "greenlet>=3.5.0",
    "alembic>=1.19.0",
    # --- LLM + HTTP ---
    "openai>=3.8.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=1.14.0",
]

[project.scripts]
mcp-crm-server = "mcp_servers.crm_server.__main__:main"
mcp-task-server = "mcp_servers.task_server.__main__:main"
mcp-spreadsheet-server = "mcp_servers.spreadsheet_server.__main__:main"
mcp-email-server = "mcp_servers.email_server.__main__:main"
mcp-calendar-server = "mcp_servers.calendar_server.__main__:main"

[project.urls]
Repository = "https://github.com/rishab-sharma/mcp-business-assistant"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_servers"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config -m 'not slow and not live'"
markers = [
    "unit: fast, isolated tests with no I/O beyond a local database",
    "integration: tests that drive real MCP servers, the ASGI app or a database",
    "slow: deterministic but expensive -- launches MCP servers as real subprocesses (run with -m slow)",
    "live: OPTIONAL, requires real third-party credentials (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "mcp_servers"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "B008",    # FastAPI dependency injection relies on calls in argument defaults
    "RUF012",  # ClassVar annotations are noisy on SQLAlchemy/pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]           # asserts and dummy credentials are expected in tests
"app/core/security.py" = ["S324"]              # non-cryptographic hashing is explicitly documented there
# ASYNC109 prefers `asyncio.timeout` at the call site over a `timeout` parameter.
# Here a per-call budget IS the public contract of the MCP layer (different tools
# warrant different budgets), and it is implemented with `asyncio.wait_for`
# internally rather than by passing the value further down.
"app/mcp/client.py" = ["ASYNC109"]
"app/mcp/manager.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = "^(alembic|tests)/"
